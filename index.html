    <meta name="apple-mobile-web-app-title" content="Money Track" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffffff" />
    <title>Money Track</title>
    <script>
      // Apply theme before first paint. Key must match THEME_KEY in src/constants/storage.ts.
      (function () {
        var media = window.matchMedia('(prefers-color-scheme: dark)');
        window.applyTheme = function () {
          var pref = 'system';
          try { pref = localStorage.getItem('moneytrack_theme') || 'system'; } catch (e) {}
          var dark = pref === 'dark' || (pref === 'system' && media.matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#101828' : '#ffffff');
        };
        window.applyTheme();
        media.addEventListener('change', window.applyTheme);
      })();
    </script>
